<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doc Free · Agent-native 多人协作</title>
<style>
*{box-sizing:border-box}:root{--muted:#858b98;--line:#e7e9ee;--purple:#6656e8;--soft:#f2f0ff}body{margin:0;height:100vh;overflow:hidden;display:flex;background:#f7f8fa;color:#202124;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,textarea{font:inherit}.sidebar{width:255px;background:#fff;border-right:1px solid var(--line);padding:20px 13px;display:flex;flex-direction:column}.brand{font-size:20px;font-weight:800;margin:0 10px 20px}.brand i{font-style:normal;color:var(--purple)}.workspace{background:var(--soft);padding:11px 12px;border-radius:10px;margin-bottom:12px}.muted{font-size:12px;color:var(--muted)}.label{font-size:11px;color:#999eaa;letter-spacing:1px;margin:17px 10px 7px}.doc,.nav{padding:9px 10px;border-radius:8px;cursor:pointer;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.doc:hover,.nav:hover{background:#f5f5f8}.doc.active{background:#eeeafe;color:#5141d8;font-weight:650}.new{border:1px dashed #c7cbd5}.demo{display:grid;grid-template-columns:1fr 1fr;gap:6px}.demo button{font-size:12px;padding:8px 4px}.profile{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;display:flex;align-items:center;gap:9px}.avatar{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:var(--purple);color:#fff;font-weight:700}.dot{color:#28a264}main{min-width:0;flex:1;display:flex;flex-direction:column}.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:10px}.spacer{flex:1}.btn{border:1px solid #dfe1e7;background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}.btn:hover{background:#f7f7fa}.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}.status{font-size:12px;color:var(--muted)}.layout{display:flex;flex:1;min-height:0}.editor-shell{flex:1;min-width:0;overflow:auto;background:#fff}.editor{max-width:800px;margin:auto;padding:50px 66px 100px}.title{font-size:38px;font-weight:760;letter-spacing:-1.3px;border:0;outline:0;width:100%;margin-bottom:25px}.content{min-height:520px;outline:0;font-size:16px;line-height:1.75}.content .ProseMirror{min-height:520px;outline:none}.content .ProseMirror p{margin:.55em 0}.right{width:355px;border-left:1px solid var(--line);background:#fbfbfd;display:flex;flex-direction:column}.right-head{padding:18px 18px 12px;border-bottom:1px solid var(--line)}.right-head h3{margin:0 0 7px}.people{display:flex;align-items:center;gap:5px;min-height:27px;flex-wrap:wrap}.person{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 7px;font-size:11px}.person b{width:7px;height:7px;border-radius:50%;display:inline-block}.chat{flex:1;overflow:auto;padding:13px 16px}.bubble{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin:8px 0;line-height:1.5;overflow-wrap:anywhere}.bubble.agent{background:var(--soft);border-color:#dfdcff}.bubble .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px}.bubble .author{font-weight:700}.actions{font-size:11px;margin-top:8px;color:#5a6170}.composer{padding:12px;border-top:1px solid var(--line);background:#fff}.composer textarea{width:100%;height:68px;resize:none;border:1px solid #dcdee7;border-radius:9px;padding:9px;outline:none}.composer-row{display:flex;justify-content:space-between;align-items:center;margin-top:7px}.thinking{color:var(--purple);font-size:12px;display:none}.login{position:fixed;inset:0;background:rgba(247,248,250,.97);z-index:20;display:grid;place-items:center}.login-card{width:min(420px,calc(100vw - 32px));background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 18px 60px #30304018}.login h1{margin:0 0 7px}.login label{display:block;font-size:12px;color:var(--muted);margin:17px 0 6px}.login input{width:100%;padding:11px;border:1px solid #dcdfe7;border-radius:9px;outline:none}.error{color:#cb3d4d;font-size:12px;min-height:18px;margin-top:8px}@media(max-width:980px){.sidebar{width:210px}.right{width:310px}.editor{padding:36px 35px}}@media(max-width:760px){.sidebar{display:none}.right{position:absolute;right:0;top:62px;bottom:0;width:min(355px,100%)}.editor-shell{display:none}.top a{display:none}}
</style></head><body>
<div class="login" id="login"><form class="login-card" id="loginForm"><h1><span style="color:#6656e8">✦</span> 加入 Doc Free</h1><div class="muted">多人实时编辑 + 群聊里的文档 Agent</div><label>你的显示名称</label><input id="loginName" maxlength="24" placeholder="例如 Alice" required><label>访问令牌</label><input id="loginToken" type="password" placeholder="由工作空间管理员提供" required><div class="error" id="loginError"></div><button class="btn primary" style="width:100%;padding:11px" type="submit">进入协作空间</button></form></div>
<aside class="sidebar"><div class="brand"><i>✦</i> Doc Free</div><div class="workspace"><b>Agent-native Demo</b><div class="muted">本地部署 · 多人实时在线</div></div><div class="label">文档</div><div id="docs"></div><div class="nav new" id="new">＋ 新建文档</div><div class="label">一键测试</div><div class="demo"><button class="btn" id="idiomDemo">成语接龙</button><button class="btn" id="essayDemo">错误作文</button></div><div class="profile"><div class="avatar" id="avatar">?</div><div><b id="selfName">未登录</b><div class="muted"><span class="dot">●</span> <span id="connection">连接中</span></div></div></div></aside>
<main><header class="top"><span class="muted">工作空间 /</span><b id="topTitle">Doc Free</b><div class="spacer"></div><span class="status" id="syncStatus">○ 等待协作连接</span><a class="btn" href="http://localhost:3010/workspace/779fabb1-3e57-4164-af4c-1ed50153e16a/all" target="_blank">AFFiNE</a><a class="btn" href="http://localhost:3020" target="_blank">Docmost</a><button class="btn" id="share">分享</button><button class="btn primary" id="save">保存</button></header><div class="layout"><div class="editor-shell"><article class="editor"><input id="title" class="title" placeholder="未命名文档"><div id="content" class="content"></div></article></div><section class="right"><div class="right-head"><h3>群聊 <span class="muted">· @doc_free 可执行</span></h3><div class="people" id="people"><span class="muted">等待成员加入…</span></div></div><div class="chat" id="chat"><div class="bubble agent">在群里输入 <b>@doc_free</b>，我会读取共同编辑的正文、修改文档，并同步到 AFFiNE 和 Docmost。</div></div><div class="composer"><textarea id="message" placeholder="发消息，或 @doc_free 修改当前文档…"></textarea><div class="composer-row"><span class="thinking" id="thinking">✦ Agent 正在处理…</span><button class="btn primary" id="send">发送</button></div></div></section></div></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);let token=localStorage.docFreeToken||"",name=localStorage.docFreeUserName||"",docs=[],current=null,socket=null,messages=[];$("loginName").value=name;$("loginToken").value=token;
function headers(){return{"content-type":"application/json",authorization:"Bearer "+token}}async function api(url,options={}){const r=await fetch(url,{...options,headers:{...headers(),...(options.headers||{})}}),v=await r.json();if(!r.ok||v.error)throw new Error(v.error||`请求失败 (${r.status})`);return v}async function login(){try{const data=await api("/api/bootstrap");docs=data.docs||[];localStorage.docFreeToken=token;localStorage.docFreeUserName=name;$("login").style.display="none";$("selfName").textContent=name;$("avatar").textContent=name.slice(0,1).toUpperCase();connectGroup();renderDocs();const requested=new URLSearchParams(location.search).get("doc");openDoc(docs.find(d=>d.id===requested)?.id||docs[0]?.id)}catch(e){$("login").style.display="grid";$("loginError").textContent="无法加入：名称或访问令牌不正确"}}$("loginForm").onsubmit=e=>{e.preventDefault();name=$("loginName").value.trim();token=$("loginToken").value;$("loginError").textContent="";login()};
function renderDocs(){$("docs").innerHTML=docs.map(d=>`<div class="doc ${current?.id===d.id?"active":""}" data-id="${esc(d.id)}">${esc(d.icon||"◈")}　${esc(d.title)}</div>`).join("");document.querySelectorAll(".doc").forEach(el=>el.onclick=()=>openDoc(el.dataset.id))}function openDoc(id){current=docs.find(d=>d.id===id);if(!current)return;window.docFreeCurrent=current;$("title").value=current.title;$("topTitle").textContent=current.title;renderDocs();renderChat();dispatchEvent(new CustomEvent("docfree:open",{detail:current}));sendSocket({type:"focus",documentId:id})}function currentContent(){return window.docFreeEditor?.getText?.()??current?.content??""}function sendSocket(v){if(socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify(v))}
function connectGroup(){socket=new WebSocket(`${location.protocol==="https:"?"wss:":"ws:"}//${location.host}/group`);socket.onopen=()=>sendSocket({type:"auth",token,name,documentId:current?.id});socket.onmessage=e=>handleGroup(JSON.parse(e.data));socket.onclose=()=>{$("connection").textContent="已断线，重连中";setTimeout(connectGroup,1500)}}function handleGroup(e){if(e.type==="ready"){messages=e.messages||[];$("connection").textContent="群聊已连接";renderChat()}else if(e.type==="presence")renderPeople(e.users||[]);else if(e.type==="chat"){messages.push(e.message);messages=messages.slice(-100);renderChat()}else if(e.type==="agent_status"&&e.documentId===current?.id)$("thinking").style.display=e.running?"inline":"none";else if(e.type==="document"){const i=docs.findIndex(d=>d.id===e.document.id);if(i>=0)docs[i]={...docs[i],...e.document};else docs.unshift(e.document);if(current?.id===e.document.id){current=docs.find(d=>d.id===e.document.id);$("title").value=current.title;$("topTitle").textContent=current.title}renderDocs()}else if(e.type==="docs_changed")refreshDocs()}
function renderPeople(users){$("people").innerHTML=users.map(u=>`<span class="person"><b style="background:${esc(u.color)}"></b>${esc(u.name)}${u.documentId===current?.id?" · 当前文档":""}</span>`).join("")||'<span class="muted">暂无在线成员</span>'}function renderChat(){const list=messages.filter(m=>!current||m.documentId===current.id);$("chat").innerHTML=list.map(m=>{const a=(m.actions||[]).map(x=>`${x.target==="affine"?"AFFiNE":"Docmost"}：${x.ok?(x.operation==="created"?"已创建":"已更新"):"失败"}`).join(" · ");return`<div class="bubble ${m.role==="agent"?"agent":""}"><div class="meta"><span class="author" style="color:${esc(m.color||"#6656e8")}">${esc(m.author)}</span><span>${new Date(m.at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</span></div>${esc(m.text).replace(/\n/g,"<br>")}${a?`<div class="actions">✓ ${esc(a)}</div>`:""}</div>`}).join("")||'<div class="muted">当前文档还没有群聊消息</div>';$("chat").scrollTop=$("chat").scrollHeight}async function refreshDocs(){const d=await api("/api/bootstrap");docs=d.docs||[];if(current)current=docs.find(x=>x.id===current.id)||docs[0];renderDocs()}
$("send").onclick=()=>{const text=$("message").value.trim();if(!text||!current)return;sendSocket({type:"chat",text,documentId:current.id,currentTitle:$("title").value,currentContent:currentContent()});$("message").value=""};$("message").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("send").click()}};$("new").onclick=async()=>{const d=await api("/api/docs",{method:"POST",body:JSON.stringify({title:"未命名文档",content:""})});docs.unshift(d);openDoc(d.id)};$("save").onclick=async()=>{if(!current)return;const d=await api(`/api/docs/${current.id}`,{method:"PUT",body:JSON.stringify({title:$("title").value,content:currentContent()})});docs=docs.map(x=>x.id===d.id?d:x);current=d;$("topTitle").textContent=d.title;renderDocs()};$("share").onclick=async()=>{const u=`${location.origin}${location.pathname}?doc=${current.id}`;try{await navigator.clipboard.writeText(u);alert("当前文档公网链接已复制")}catch{prompt("复制这个链接",u)}};
async function createDemo(kind){const essay=`Writing Agent Is Very Usefull\n\nWriting agent are a new tools that help people to wrote faster. It can understand our idea and make many article in few second. But sometime it give wrong informations, so user should checks it careful.\n\nWhen we build a agent, we needs give it clear goal and some tool. The agent can searches web, write document and talking with other peoples. This make teamwork become more easier.\n\nIn the future, writing agents will became a important partner. They doesn't replace human creativity, but it help us organize thinking and finish works better.`;const p=kind==="idiom"?{title:"多人在线成语接龙",content:"## 接龙规则\n\n每个人接一个成语，后一个成语首字与前一个成语尾字相同。\n\n### 当前接龙\n\n四面楚歌"}:{title:"Writing Agents · 多人纠错作文",content:essay};const d=await api("/api/docs",{method:"POST",body:JSON.stringify(p)});docs.unshift(d);openDoc(d.id);sendSocket({type:"chat",text:kind==="idiom"?"成语接龙 Demo 已开始：下一位请从「歌」字接龙。需要裁判时 @doc_free。":"错误英语作文 Demo 已创建：大家可以分段修改，最后 @doc_free 检查剩余错误。",documentId:d.id,currentTitle:d.title,currentContent:d.content})}$("idiomDemo").onclick=()=>createDemo("idiom");$("essayDemo").onclick=()=>createDemo("essay");addEventListener("docfree:sync",e=>{$("syncStatus").textContent=e.detail==="connected"?"● 多人实时同步":"○ 协作连接中"});if(token&&name)login();
addEventListener("docfree:title",e=>{if(!current)return;current.title=e.detail;$("topTitle").textContent=e.detail;renderDocs()});
</script></body></html>
