services:
  affine:
    image: ghcr.io/toeverything/affine:stable
    restart: unless-stopped
    depends_on: [affine-db, affine-redis, affine-indexer]
    ports: ["3010:3010"]
    environment:
      AFFINE_SERVER_HOST: ${AFFINE_SERVER_HOST:-localhost:3010}
      AFFINE_SERVER_HTTPS: ${AFFINE_SERVER_HTTPS:-false}
      DATABASE_URL: postgresql://affine:${AFFINE_DB_PASSWORD}@affine-db:5432/affine
      REDIS_SERVER_HOST: affine-redis
      REDIS_SERVER_PORT: 6379
      AFFINE_INDEXER_ENABLED: "true"
      AFFINE_INDEXER_SEARCH_PROVIDER: manticoresearch
      AFFINE_INDEXER_SEARCH_ENDPOINT: http://affine-indexer:9308
      AFFINE_ENV: dev
    command: >-
      sh -c "mkdir -p /app/prisma && cp -rn /app/migrations /app/prisma/ &&
      cp -n /app/node_modules/.prisma/client/schema.prisma /app/prisma/schema.prisma || true;
      npx prisma migrate deploy --schema /app/prisma/schema.prisma;
      SERVER_FLAVOR=script node ./dist/main.js run;
      node ./dist/main.js"
    volumes: [affine_storage:/root/.affine/storage]
    networks: [affine]
  affine-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: affine
      POSTGRES_PASSWORD: "${AFFINE_DB_PASSWORD}"
      POSTGRES_DB: affine
    volumes: [affine_db:/var/lib/postgresql/data]
    ports: ["127.0.0.1:54331:5432"]
    networks: [affine]
  affine-redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes: [affine_redis:/data]
    networks: [affine]
  affine-indexer:
    image: docker.1ms.run/manticoresearch/manticore:latest
    restart: unless-stopped
    volumes: [affine_indexer:/var/lib/manticore]
    networks: [affine]
  docmost:
    image: docker.1ms.run/docmost/docmost:latest
    restart: unless-stopped
    depends_on: [docmost-db, docmost-redis]
    ports: ["3020:3000"]
    environment:
      APP_URL: ${DOCMOST_APP_URL:-http://localhost:3020}
      APP_SECRET: ${DOCMOST_APP_SECRET}
      DATABASE_URL: postgresql://docmost:${DOCMOST_DB_PASSWORD}@docmost-db:5432/docmost
      REDIS_URL: redis://docmost-redis:6379
    volumes: [docmost_storage:/app/data/storage]
    networks: [docmost]
  docmost-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: "${DOCMOST_DB_PASSWORD}"
      POSTGRES_DB: docmost
    volumes: [docmost_db:/var/lib/postgresql/data]
    ports: ["127.0.0.1:54332:5432"]
    networks: [docmost]
  docmost-redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes: [docmost_redis:/data]
    networks: [docmost]
volumes:
  {
    affine_storage: {},
    affine_db: {},
    affine_redis: {},
    affine_indexer: {},
    docmost_storage: {},
    docmost_db: {},
    docmost_redis: {},
  }
networks: { affine: {}, docmost: {} }
